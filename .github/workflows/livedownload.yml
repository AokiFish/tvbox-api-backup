name: 接口扫描处理工具

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:
    inputs:
      force:
        description: "强制执行（忽略日期/频率限制，立即运行）"
        required: false
        type: boolean
        default: false
      debug:
        description: "详细调试日志"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'tvbox/**'
      - 'python/**'
      - '.github/workflows/tvbox_scan.yml'

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests urllib3

      - name: 运行接口扫描处理工具
        run: |
          ARGS=""
          ${{ github.event.inputs.debug == 'true' && 'ARGS="$ARGS --debug"' || '' }}
          ${{ github.event.inputs.force == 'true' && 'ARGS="$ARGS --force"' || '' }}
          cd python
          python "接口扫描处理工具.py" $ARGS

      - name: 提交产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add tvbox/ livelist.txt cjlist.txt pylist.txt
          git commit -m "chore: 自动更新聚合接口 $(TZ='CST-8' date +%Y-%m-%d)" || echo "no changes"
          git push
